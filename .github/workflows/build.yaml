name: Build MorpheApp APKs

on:
  schedule:
    # 毎日日本時間の深夜2時（UTCの17時）に自動実行
    - cron: '0 17 * * *'
  workflow_dispatch: # 手動実行ボタン
    inputs:
      probe:
        description: "APKMirror への接続確認だけを行い、ビルドは実行しない"
        type: boolean
        default: false
      no_release:
        description: "ビルドのみ行い、GitHub リリースは作成しない"
        type: boolean
        default: false

jobs:
  build:
    if: ${{ !inputs.probe }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install headless browser (Cloudflare fallback)
        continue-on-error: true
        run: |
          python -m playwright install --with-deps chromium

      - name: Run build pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 任意: APKMirror 用の HTTP(S) プロキシ (例 http://user:pass@host:port)。
          # 未設定なら GitHub ランナーの IP で直接アクセスする。
          APKMIRROR_PROXY: ${{ secrets.APKMIRROR_PROXY }}
        run: |
          mkdir -p bins
          python -u main.py ${{ inputs.no_release && '--no-release' || '' }}

  runner-probe:
    if: ${{ inputs.probe }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Probe runner
        env:
          # 直接アクセスが通るかに関係なく、中継経路 (Google Translate) を検証する
          APKMIRROR_FORCE_RELAY: "1"
        run: |
          python -u .github/runner_probe.py
